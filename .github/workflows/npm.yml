name: NPM

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Show runtime versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify committed migrations match schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --porcelain -- drizzle
            echo "::error::drizzle/ is out of sync with the schema — run 'npm run db:generate' and commit the result"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Validate package
        run: npm run check:package

      - name: Resolve browser bundle
        run: npm run check:browser

      - name: Validate browser package fixture
        run: npm run check:fixture

      - name: Test node storage
        run: npm run test

      - name: Test browser storage
        run: npm run test:browser
